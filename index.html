<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Movie Hub - Watch & Download Free HD Movies Online</title>
    
    <!-- SEO Meta Tags for Google Search Engine -->
    <meta name="description" content="Stream and download the latest blockbuster movies, trending series, action, comedy, and horror films in HD quality for free on Pro Movie Hub.">
    <meta name="keywords" content="free movies, watch movies online, HD movies stream, latest Hollywood movies, action movies, movie portal">
    <meta name="author" content="Pro Movie Hub">
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Pro Movie Hub - Free HD Movies Streaming">
    <meta property="og:description" content="Discover and stream the latest trending movies and TV shows instantly.">
    <meta property="og:type" content="website">

    <style>
        /* Base Styles & Dark Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }
        header {
            background-color: #1f1f1f;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e50914;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .logo {
            font-size: 1.3rem;
            font-weight: bold;
            color: #e50914;
            white-space: nowrap;
        }
        nav {
            display: flex;
            gap: 15px;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
            white-space: nowrap;
        }
        nav a:hover {
            color: #e50914;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
        }
        
        /* Hero Banner */
        .welcome-banner {
            background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('https://image.tmdb.org/t/p/original/wwemzKWzjKYJFfCeiB57q3r4Bcm.jpg');
            background-size: cover;
            background-position: center;
            padding: 40px 15px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .welcome-banner h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #fff;
        }
        .welcome-banner p {
            font-size: 0.95rem;
            color: #ccc;
        }

        /* Search & Filter Container */
        .search-filter-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            background: #1f1f1f;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .search-box {
            display: flex;
            width: 100%;
        }
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            background: #2b2b2b;
            border: 1px solid #444;
            border-radius: 6px 0 0 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .search-box input:focus {
            border-color: #e50914;
        }
        .search-box button {
            background: #e50914;
            border: none;
            padding: 0 20px;
            color: #fff;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .search-box button:hover {
            background: #f6121d;
        }

        /* Genre Tags Scrollable Bar */
        .genre-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: thin;
            scrollbar-color: #e50914 #2b2b2b;
        }
        .genre-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .genre-scroll::-webkit-scrollbar-thumb {
            background: #e50914;
            border-radius: 3px;
        }
        .genre-btn {
            background: #2b2b2b;
            color: #ccc;
            border: 1px solid #444;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }
        .genre-btn:hover, .genre-btn.active {
            background: #e50914;
            color: #fff;
            border-color: #e50914;
        }

        /* Movie Section Title & Grid */
        .section-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            border-left: 4px solid #e50914;
            padding-left: 10px;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 40px;
        }
        .movie-card {
            background: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3);
        }
        .movie-poster {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .movie-details {
            padding: 10px;
        }
        .movie-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-year {
            font-size: 0.8rem;
            color: #aaa;
        }

        /* Loading Spinner */
        .loading {
            text-align: center;
            padding: 20px;
            font-size: 1rem;
            color: #e50914;
            display: none;
        }

        /* Footer */
        footer {
            background: #1f1f1f;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            border-top: 1px solid #333;
            font-size: 0.85rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <header>
        <div class="logo">🎬 Pro Movie Hub</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Movies</a>
            <a href="#">Series</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <!-- Main Container -->
    <div class="container">
        <!-- Hero Banner -->
        <div class="welcome-banner">
            <h1>Stream & Download Free HD Movies</h1>
            <p>Watch latest releases and download high-quality movies in single click.</p>
        </div>

        <!-- Search & Genre Filter Box -->
        <div class="search-filter-container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search movies..." onkeyup="handleSearch(event)">
                <button onclick="searchMovies()">Search</button>
            </div>
            <!-- Genre Buttons Bar -->
            <div class="genre-scroll" id="genreContainer">
                <button class="genre-btn active" onclick="filterByGenre('', this)">All</button>
                <button class="genre-btn" onclick="filterByGenre('28', this)">Action</button>
                <button class="genre-btn" onclick="filterByGenre('35', this)">Comedy</button>
                <button class="genre-btn" onclick="filterByGenre('27', this)">Horror</button>
                <button class="genre-btn" onclick="filterByGenre('10749', this)">Romance</button>
                <button class="genre-btn" onclick="filterByGenre('878', this)">Sci-Fi</button>
                <button class="genre-btn" onclick="filterByGenre('53', this)">Thriller</button>
                <button class="genre-btn" onclick="filterByGenre('16', this)">Animation</button>
            </div>
        </div>

        <!-- Movie Catalog Grid -->
        <h2 class="section-title" id="sectionTitle">Trending Movies</h2>
        <div class="movie-grid" id="movieGrid">
            <!-- Dynamic Movies from TMDB API -->
        </div>

        <!-- Loading Indicator -->
        <div class="loading" id="loadingText">Loading more movies...</div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Pro Movie Hub. All Rights Reserved. Hosted on GitHub Pages.</p>
    </footer>

    <!-- TMDB API, Genre Filter & Redirect Script -->
    <script>
        const apiKey = 'f3367d69a28ea25da050a43542a03232';
        const imageBaseUrl = 'https://image.tmdb.org/t/p/w500';
        
        // 🔗 আপনার টার্গেট রিডাইরেক্ট লিংকটি এখানে বসিয়ে দিন:
        const targetRedirectUrl = 'https://your-link-here.com'; 

        let currentPage = 1;
        let isLoading = false;
        let currentMode = 'trending'; 
        let currentQuery = '';
        let selectedGenreId = '';

        async function fetchMovies(page = 1, append = false) {
            if (isLoading) return;
            isLoading = true;
            document.getElementById('loadingText').style.display = 'block';

            let url = '';
            if (currentMode === 'search') {
                url = `https://api.themoviedb.org/3/search/movie?api_key=${apiKey}&query=${encodeURIComponent(currentQuery)}&page=${page}`;
            } else if (currentMode === 'genre') {
                url = `https://api.themoviedb.org/3/discover/movie?api_key=${apiKey}&with_genres=${selectedGenreId}&page=${page}`;
            } else {
                url = `https://api.themoviedb.org/3/trending/movie/day?api_key=${apiKey}&page=${page}`;
            }

            try {
                let response = await fetch(url);
                let data = await response.json();
                displayMovies(data.results, append);
                
                if (page < data.total_pages) {
                    currentPage = page + 1;
                } else {
                    document.getElementById('loadingText').innerText = 'No more movies to load.';
                }
            } catch (error) {
                console.error('Error fetching movies:', error);
            } finally {
                isLoading = false;
                if (currentPage > 1 || !append) {
                    document.getElementById('loadingText').style.display = 'none';
                }
            }
        }

        function displayMovies(movies, append) {
            const grid = document.getElementById('movieGrid');
            if (!append) {
                grid.innerHTML = '';
            }

            if (!movies || movies.length === 0) {
                if (!append) grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">No movies found.</p>';
                return;
            }

            movies.forEach(movie => {
                let poster = movie.poster_path ? imageBaseUrl + movie.poster_path : 'https://via.placeholder.com/500x750?text=No+Image';
                let title = movie.title || movie.name;
                let releaseDate = movie.release_date ? movie.release_date.split('-')[0] : 'N/A';

                let card = document.createElement('div');
                card.className = 'movie-card';
                
                card.onclick = () => {
                    window.open(targetRedirectUrl, '_blank');
                };

                card.innerHTML = `
                    <img src="${poster}" alt="${title}" class="movie-poster">
                    <div class="movie-details">
                        <div class="movie-title">${title}</div>
                        <div class="movie-year">${releaseDate} • HD</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function searchMovies() {
            let query = document.getElementById('searchInput').value;
            if (query.trim() === '') return;
            
            currentQuery = query;
            currentMode = 'search';
            currentPage = 1;
            document.getElementById('sectionTitle').innerText = `Search Results for: "${query}"`;
            
            document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));

            fetchMovies(1, false);
        }

        function handleSearch(event) {
            if (event.key === 'Enter') {
                searchMovies();
            }
        }

        function filterByGenre(genreId, btnElement) {
            document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            
            document.getElementById('searchInput').value = '';
            selectedGenreId = genreId;
            currentPage = 1;

            if (genreId === '') {
                currentMode = 'trending';
                document.getElementById('sectionTitle').innerText = 'Trending Movies';
            } else {
                currentMode = 'genre';
                document.getElementById('sectionTitle').innerText = `${btnElement.innerText} Movies`;
            }

            fetchMovies(1, false);
        }

        // Infinite Scroll
        window.addEventListener('scroll', () => {
            const { scrollTop, scrollHeight, clientHeight } = document.documentElement;
            if (scrollTop + clientHeight >= scrollHeight - 200) {
                fetchMovies(currentPage, true);
            }
        });

        // Initial Load
        fetchMovies(1, false);
    </script>
</body>
</html>
